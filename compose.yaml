services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: waymark
      POSTGRES_USER: waymark
      POSTGRES_PASSWORD: waymark_dev
    ports:
      - "5432:5432"
    volumes:
      - waymark_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waymark -d waymark"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  waymark_postgres:
